<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="从零开始练习 C 语言：短课、代码观察和小测验。">
  <title>C Lab · 从零练习 C 语言</title>
  <style>
    :root{--ink:#242b38;--muted:#747d8c;--paper:#fbfaf7;--card:#fff;--line:#ece9e1;--blue:#5269d9;--blue2:#eef0ff;--mint:#dff4e9;--yellow:#fff1c9;--coral:#ffe2d9;--shadow:0 12px 35px #27314c0c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:22px 26px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.logo{width:42px;height:42px;border-radius:14px;background:var(--blue);color:white;display:grid;place-items:center;font:800 17px ui-monospace,monospace;box-shadow:0 6px 15px #5269d944}.brand small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:-3px}.top-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}.reset{border:0;background:transparent;color:var(--muted);text-decoration:underline}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;margin-bottom:26px}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.08em}.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.12;letter-spacing:-.04em;margin:12px 0}.hero p{color:var(--muted);font-size:17px;max-width:580px;margin:0 0 22px}.primary,.secondary,.lesson-btn{border:0;border-radius:13px;padding:12px 18px;font-weight:750}.primary{background:var(--blue);color:white;box-shadow:0 7px 15px #5269d933}.primary:hover{background:#4057c8}.secondary{background:var(--blue2);color:var(--blue)}.mascot{border-radius:28px;background:linear-gradient(145deg,#fff1cd,#fce1db);min-height:210px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.mascot:before,.mascot:after{content:"";position:absolute;border-radius:50%;background:#ffffff77}.mascot:before{width:170px;height:170px;left:-50px;top:-70px}.mascot:after{width:110px;height:110px;right:-30px;bottom:-36px}.mascot-art{font-size:92px;z-index:1;filter:drop-shadow(0 9px 5px #a47d4325)}.mascot-note{position:absolute;z-index:2;right:22px;top:20px;background:#fff;border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:var(--shadow);transform:rotate(3deg)}.stats{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);padding:17px 20px;border-radius:18px;margin-bottom:25px;box-shadow:var(--shadow)}.stats strong{display:block}.stats span{font-size:13px;color:var(--muted)}.progress-wrap{display:flex;align-items:center;gap:12px}.bar{width:min(260px,30vw);height:9px;border-radius:9px;background:#eeeef3;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7788f2,#53bd91);border-radius:inherit;transition:width .25s}.layout{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.side{padding:17px;position:sticky;top:18px}.side h2{font-size:15px;margin:4px 8px 13px}.lesson-list{display:grid;gap:8px}.lesson-btn{width:100%;text-align:left;background:transparent;padding:12px;display:flex;gap:11px;align-items:center;color:var(--ink);border:1px solid transparent}.lesson-btn:hover{background:#fafaff}.lesson-btn.active{background:var(--blue2);border-color:#e2e5ff;color:#354dc3}.lesson-btn.done .num{background:#dff4e9;color:#28764d}.num{width:32px;height:32px;border-radius:11px;background:#f3f2ef;display:grid;place-items:center;flex:none;font-size:13px}.lesson-label{flex:1}.lesson-label b{display:block;font-size:14px}.lesson-label small{color:var(--muted);font-weight:500}.tick{color:#39865e}.content{padding:28px 32px;min-height:520px}.content-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.tag{display:inline-block;border-radius:99px;background:var(--mint);color:#28764d;padding:4px 10px;font-size:12px;font-weight:750}.content h2{font-size:30px;line-height:1.2;margin:12px 0 8px}.intro{color:var(--muted);margin:0 0 23px}.concept{border-radius:16px;padding:17px 19px;background:#f7f7fd;border:1px solid #eeeeF8;margin-bottom:21px}.concept b{display:block;margin-bottom:5px}.code-title{display:flex;justify-content:space-between;color:#727b89;font-size:13px;padding:0 4px 7px}.code{background:#202737;border-radius:16px;padding:18px;color:#e8edff;overflow:auto;font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}.code .comment{color:#91a39b}.code .kw{color:#c5a6ff}.code .str{color:#a4e5c0}.practice{background:#fff8e8;border:1px solid #f6e9c6;border-radius:16px;padding:16px 18px;margin:22px 0}.practice h3{font-size:15px;margin:0 0 5px}.practice p{color:#73716a;margin:0 0 12px;font-size:14px}.choices{display:flex;gap:9px;flex-wrap:wrap}.choice{border:1px solid #e9dfc7;background:white;border-radius:11px;padding:8px 13px}.choice:hover{border-color:#d5b65f}.choice.correct{background:#e2f5e9;border-color:#a6d8b7;color:#24683d}.choice.wrong{background:#ffe9e2;border-color:#eeb4a4;color:#974634}.feedback{margin-top:10px;font-size:14px;font-weight:700;min-height:22px}.complete-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:25px}.complete-row p{font-size:13px;color:var(--muted);margin:0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#242b38;color:white;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.footer{text-align:center;color:#969ba4;font-size:12px;margin-top:25px}@media(max-width:780px){.shell{padding:16px 15px 48px}.hero{grid-template-columns:1fr;gap:18px}.mascot{min-height:135px}.mascot-art{font-size:68px}.layout{grid-template-columns:1fr}.side{position:static}.lesson-list{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:23px 19px}.content h2{font-size:26px}.top{margin-bottom:22px}.top-right{font-size:12px}.stats{padding:14px}.progress-wrap{gap:8px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><div class="logo">C;</div><div>C Lab<small>每天一点点，写出第一行 C</small></div></div>
      <div class="top-right"><span>🌱 慢慢来就会进步</span><button class="reset" id="reset">重置进度</button></div>
    </header>
    <section class="hero">
      <div><div class="eyebrow">BEGINNER · 从零起步</div><h1>把“看懂”变成<br>“自己会写”</h1><p>每次只学一个小知识，再做一道小练习。没有基础也没关系，我们从最简单的 C 程序开始。</p><button class="primary" id="start">继续今天的学习　→</button></div>
      <div class="mascot"><div class="mascot-note">今天学一点点就很好 ✨</div><div class="mascot-art" aria-hidden="true">🦊💻</div></div>
    </section>
    <section class="stats" aria-label="学习进度"><div><strong>我的学习进度</strong><span id="progressText">完成 0 / 6 节</span></div><div class="progress-wrap"><div class="bar"><i id="progressBar"></i></div><b id="percent">0%</b></div></section>
    <div class="layout">
      <aside class="panel side"><h2>🌼 学习路线</h2><nav class="lesson-list" id="lessonList" aria-label="课程列表"></nav></aside>
      <article class="panel content" id="lessonContent" aria-live="polite"></article>
    </div>
    <div class="footer">你的学习进度只保存在当前浏览器中 · C Lab 初学者版</div>
  </main>
  <div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const lessons=[
 {title:'认识 C 程序',time:'3 分钟',intro:'先认一认一个 C 程序最常见的样子。暂时不用背，知道每一块大概做什么就好。',concept:'程序可以理解成一张“给电脑的步骤清单”。main 是程序开始工作的地方；大括号 { } 把要执行的步骤括起来；每条语句通常用分号结束。',code:'<span class="comment">// 我的第一个 C 程序</span>\n<span class="kw">#include</span> &lt;stdio.h&gt;\n\n<span class="kw">int</span> main() {\n    printf(<span class="str">"Hello, C!\\n"</span>);\n    <span class="kw">return</span> 0;\n}',question:'下面哪一个符号通常用来结束一条 C 语句？',choices:['逗号 ,','分号 ;','冒号 :'],answer:1,explain:'对，语句末尾通常写分号 ;。'},
 {title:'变量：给数据起名字',time:'4 分钟',intro:'变量像一个贴了标签的小盒子，可以放一个之后还会用到的数据。',concept:'int 常用来保存整数。等号 = 在这里表示“把右边的值放进左边的变量”。变量使用前要先声明类型和名字。',code:'<span class="kw">int</span> age = 19;\n<span class="kw">int</span> score = 86;\nprintf(<span class="str">"年龄：%d\\n"</span>, age);',question:'这行代码 int score = 86; 中，变量名是什么？',choices:['int','score','86'],answer:1,explain:'score 是变量名；int 是类型，86 是放进去的值。'},
 {title:'输出：让程序说话',time:'4 分钟',intro:'printf 可以把文字或变量的值显示出来。先会输出，再慢慢学输入。',concept:'双引号里的内容是要显示的文字。%d 是一个整数的位置标记，逗号后面的变量会填进去。\\n 表示换到下一行。',code:'<span class="kw">int</span> apples = 3;\nprintf(<span class="str">"我有 %d 个苹果\\n"</span>, apples);\n<span class="comment">// 屏幕显示：我有 3 个苹果</span>',question:'想在屏幕输出整数变量 n，常用的格式符是哪一个？',choices:['%d','%s','%c'],answer:0,explain:'%d 用来对应整数；%s 常用于字符串，%c 常用于字符。'},
 {title:'输入：让用户回答',time:'5 分钟',intro:'scanf 可以把用户输入的内容放进变量。这里先记住最常见的整数输入。',concept:'scanf 的变量名前通常要加 &，它表示把输入放到这个变量所在的位置。格式符要和变量类型对应。',code:'<span class="kw">int</span> number;\nprintf(<span class="str">"请输入一个整数："</span>);\nscanf(<span class="str">"%d"</span>, &amp;number);\nprintf(<span class="str">"你输入了 %d\\n"</span>, number);',question:'scanf("%d", ____); 空白处应填什么？',choices:['number','&number','%number'],answer:1,explain:'整数输入时写 &number，让 scanf 能把值存进 number。'},
 {title:'判断：if 选择路线',time:'5 分钟',intro:'if 像一个岔路口：条件成立走一条路，不成立就走另一条。',concept:'条件放在圆括号里。== 表示“是否相等”；不要和 =（赋值）混淆。else 是条件不成立时执行的部分。',code:'<span class="kw">int</span> score = 75;\n<span class="kw">if</span> (score &gt;= 60) {\n    printf(<span class="str">"及格啦\\n"</span>);\n} <span class="kw">else</span> {\n    printf(<span class="str">"再练一次\\n"</span>);\n}',question:'判断两个数是否相等，应该使用哪个符号？',choices:['=','==','=&'],answer:1,explain:'== 是比较相等；单个 = 是赋值。'},
 {title:'循环：重复做一件事',time:'6 分钟',intro:'循环可以让程序重复执行一段代码。先看 for：它适合知道大概要重复几次的情况。',concept:'for (开始; 继续条件; 每轮变化) { 要重复的步骤 }。下面 i 从 1 开始，每次加 1，只要 i <= 3 就继续。',code:'<span class="kw">for</span> (<span class="kw">int</span> i = 1; i &lt;= 3; i++) {\n    printf(<span class="str">"第 %d 次练习\\n"</span>, i);\n}\n<span class="comment">// 会输出 3 行</span>',question:'i++ 通常表示什么？',choices:['i 减 1','i 加 1','i 变成 0'],answer:1,explain:'i++ 表示 i 增加 1。'}
];
const STORAGE_KEY='clab-progress-v1';
let state={current:0,done:[]};
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved&&Array.isArray(saved.done)){state.done=saved.done.filter(n=>Number.isInteger(n)&&n>=0&&n<lessons.length);state.current=Number.isInteger(saved.current)?Math.max(0,Math.min(saved.current,lessons.length-1)):0}}catch(_){state={current:0,done:[]}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(_){showToast('浏览器未能保存进度；课程仍可正常使用。')}}
function showToast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');window.setTimeout(()=>t.classList.remove('show'),1800)}
function renderList(){const list=document.getElementById('lessonList');list.replaceChildren();lessons.forEach((lesson,index)=>{const button=document.createElement('button');button.type='button';button.className='lesson-btn'+(index===state.current?' active':'')+(state.done.includes(index)?' done':'');button.setAttribute('aria-current',index===state.current?'step':'false');const num=document.createElement('span');num.className='num';num.textContent=String(index+1).padStart(2,'0');const label=document.createElement('span');label.className='lesson-label';const title=document.createElement('b');title.textContent=lesson.title;const time=document.createElement('small');time.textContent='约 '+lesson.time;label.append(title,time);const tick=document.createElement('span');tick.className='tick';tick.textContent=state.done.includes(index)?'✓':'';button.append(num,label,tick);button.addEventListener('click',()=>{state.current=index;persist();render()});list.append(button)})}
function renderContent(){const lesson=lessons[state.current],root=document.getElementById('lessonContent');root.replaceChildren();const head=document.createElement('div');head.className='content-head';const heading=document.createElement('div');const tag=document.createElement('span');tag.className='tag';tag.textContent='第 '+(state.current+1)+' 节 · '+lesson.time;const title=document.createElement('h2');title.textContent=lesson.title;const intro=document.createElement('p');intro.className='intro';intro.textContent=lesson.intro;heading.append(tag,title,intro);head.append(heading);root.append(head);const concept=document.createElement('div');concept.className='concept';const conceptTitle=document.createElement('b');conceptTitle.textContent='🧠 先记住这一点';const conceptText=document.createElement('span');conceptText.textContent=lesson.concept;concept.append(conceptTitle,conceptText);root.append(concept);const codeTitle=document.createElement('div');codeTitle.className='code-title';const codeLabel=document.createElement('span');codeLabel.textContent='代码观察';const copy=document.createElement('button');copy.className='reset';copy.type='button';copy.textContent='复制代码';copy.addEventListener('click',()=>copyCode(lesson));codeTitle.append(codeLabel,copy);const code=document.createElement('pre');code.className='code';code.innerHTML=lesson.code;root.append(codeTitle,code);const practice=document.createElement('section');practice.className='practice';const qTitle=document.createElement('h3');qTitle.textContent='🎯 小练习：'+lesson.question;const qText=document.createElement('p');qText.textContent='选一个你觉得正确的答案。答错也没关系，可以再试。';const choices=document.createElement('div');choices.className='choices';const feedback=document.createElement('div');feedback.className='feedback';feedback.setAttribute('aria-live','polite');lesson.choices.forEach((choice,index)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=choice;b.addEventListener('click',()=>{choices.querySelectorAll('button').forEach(x=>x.disabled=true);if(index===lesson.answer){b.classList.add('correct');feedback.textContent='✅ '+lesson.explain}else{b.classList.add('wrong');feedback.textContent='再想一想：'+lesson.explain;choices.querySelectorAll('button').forEach(x=>x.disabled=false);b.disabled=true}});choices.append(b)});practice.append(qTitle,qText,choices,feedback);root.append(practice);const row=document.createElement('div');row.className='complete-row';const note=document.createElement('p');note.textContent=state.done.includes(state.current)?'这节已经完成，想复习可以再做一次。':'完成小测后，点右边按钮记录进度。';const complete=document.createElement('button');complete.className='primary';complete.type='button';complete.textContent=state.done.includes(state.current)?'已完成 ✓':'我学会了，完成本节';complete.addEventListener('click',()=>{if(!state.done.includes(state.current)){state.done.push(state.current);state.done.sort((a,b)=>a-b);persist();render();showToast('进度已保存在这台设备上 🌱')}else if(state.current<lessons.length-1){state.current++;persist();render()}});row.append(note,complete);root.append(row)}
function renderProgress(){const count=state.done.length,pct=Math.round(count/lessons.length*100);document.getElementById('progressText').textContent='完成 '+count+' / '+lessons.length+' 节';document.getElementById('progressBar').style.width=pct+'%';document.getElementById('percent').textContent=pct+'%'}
function render(){renderList();renderContent();renderProgress()}
async function copyCode(lesson){const plain=lesson.code.replace(/<[^>]*>/g,'').replaceAll('&lt;','<').replaceAll('&gt;','>').replaceAll('&amp;','&');try{await navigator.clipboard.writeText(plain);showToast('代码已复制')}catch(_){showToast('复制不可用，可以手动选中代码')}}
document.getElementById('start').addEventListener('click',()=>{document.getElementById('lessonContent').scrollIntoView({behavior:'smooth',block:'start'});document.querySelector('.lesson-btn.active')?.focus()});
document.getElementById('reset').addEventListener('click',()=>{if(window.confirm('确定要清除这台设备上保存的学习进度吗？')){state={current:0,done:[]};persist();render();showToast('进度已重置')}});
render();
</script>
</body>
</html>
